version: 2

models:

  - name: stg_study

    description: >
      Clean staging view over ACT_DB.RAW.RAW_STUDY_CURRENT.
      Grain is one row per STUDY_ID.

    columns:

      # ==========================================================
      # TECHNICAL KEY
      # ==========================================================

      - name: study_key
        description: >
          Deterministic technical key generated from STUDY_ID.

        data_tests:
          - not_null
          - unique


      # ==========================================================
      # BUSINESS KEY
      # ==========================================================

      - name: study_id
        description: Clinical-study business identifier.

        data_tests:
          - not_null
          - unique


      # ==========================================================
      # ATTRIBUTES
      # ==========================================================

      - name: study_name
        description: Clinical-study name.

        data_tests:
          - not_null
          - dbt_utils.not_empty_string


      - name: phase
        description: Clinical-trial phase.


      - name: target_subjects
        description: Planned number of subjects for the study.

        data_tests:

          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                row_condition: "target_subjects is not null"


      # ==========================================================
      # TRACEABILITY
      # ==========================================================

      - name: source_updated_at
        description: Source-system update timestamp.

      - name: record_hash
        description: RAW business-content hash.

      - name: source_system
        description: Source-system identifier.

      - name: source_entity
        description: Source entity identifier.

      - name: dag_run_id
        description: Airflow DAG run responsible for ingestion.

      - name: ingested_at
        description: ACT ingestion timestamp.

      - name: source_file_name
        description: S3 source file name.

      - name: source_file_row_number
        description: Row number inside the source file.

      - name: source_file_content_key
        description: Snowflake source-file content key.

      - name: source_file_last_modified
        description: Source-file last-modified timestamp.

      - name: snowflake_load_ts
        description: Snowflake RAW load timestamp.

      - name: current_row_updated_at
        description: Timestamp when RAW_STUDY_CURRENT was maintained.