name: act_dbt
version: "1.0.0"
config-version: 2

profile: act_dbt

model-paths:
  - models

analysis-paths:
  - analyses

test-paths:
  - tests

seed-paths:
  - seeds

macro-paths:
  - macros

snapshot-paths:
  - snapshots

clean-targets:
  - target
  - dbt_packages

models:
  act_dbt:
    staging:
      +materialized: view
      +schema: staging
      +tags:
        - staging

    intermediate:
      +materialized: view
      +schema: intermediate
      +tags:
        - intermediate

    marts:
      +materialized: table
      +schema: marts
      +tags:
        - marts