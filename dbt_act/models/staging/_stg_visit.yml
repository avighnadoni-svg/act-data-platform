version: 2

models:

  - name: stg_visit

    description: >
      Clean staging view over ACT_DB.RAW.RAW_VISIT_CURRENT.
      Grain is one row per STUDY_ID + VISIT_ID.

    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - study_id
              - visit_id

    columns:

      - name: visit_key
        description: Technical key generated from STUDY_ID + VISIT_ID.
        data_tests:
          - not_null
          - unique

      - name: subject_key
        description: Parent subject technical key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_subject')
                field: subject_key

      - name: study_key
        description: Parent study technical key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_study')
                field: study_key

      - name: study_id
        data_tests:
          - not_null

      - name: visit_id
        data_tests:
          - not_null

      - name: subject_id
        data_tests:
          - not_null

      - name: visit_name
        data_tests:
          - dbt_utils.not_empty_string

      - name: planned_date

      - name: actual_date

      - name: source_updated_at

      - name: record_hash

      - name: source_system

      - name: source_entity

      - name: dag_run_id

      - name: ingested_at

      - name: source_file_name

      - name: source_file_row_number

      - name: source_file_content_key

      - name: source_file_last_modified

      - name: snowflake_load_ts

      - name: current_row_updated_at