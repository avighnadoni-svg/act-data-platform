version: 2

models:

  - name: mart_site_performance

    description: >
      Site-level clinical operations performance mart.
      Combines enrollment, adverse events, laboratory results,
      protocol deviations, and data-query metrics.
      Grain is one row per STUDY_ID + SITE_ID.

    config:
      contract:
        enforced: true

    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - study_id
              - site_id


    columns:

      - name: site_key
        data_type: varchar
        description: Technical key identifying the clinical site.
        data_tests:
          - not_null
          - unique

      - name: study_key
        data_type: varchar
        description: Technical key identifying the parent study.
        data_tests:
          - not_null

      - name: study_id
        data_type: varchar
        description: Clinical-study business identifier.
        data_tests:
          - not_null

      - name: site_id
        data_type: varchar
        description: Clinical-site business identifier.
        data_tests:
          - not_null

      - name: study_name
        data_type: varchar
        description: Clinical study name.

      - name: phase
        data_type: varchar
        description: Clinical trial phase.

      - name: country
        data_type: varchar
        description: Country in which the site operates.

      - name: investigator
        data_type: varchar
        description: Investigator associated with the clinical site.

      - name: target_enrollment
        data_type: number(38,0)
        description: Planned enrollment target for the site.

      - name: subject_count
        data_type: number(38,0)
        description: Number of subjects associated with the site.
        data_tests:
          - not_null

      - name: enrolled_subject_count
        data_type: number(38,0)
        description: Number of subjects having an enrollment date.
        data_tests:
          - not_null

      - name: enrollment_gap
        data_type: number(38,0)
        description: >
          Difference between target enrollment and current
          subject count.

      - name: enrollment_pct
        data_type: number(10,2)
        description: >
          Current subject count as a percentage of the site's
          target enrollment.

      - name: adverse_event_count
        data_type: number(38,0)
        description: Total adverse events associated with the site.
        data_tests:
          - not_null

      - name: serious_ae_count
        data_type: number(38,0)
        description: Number of serious adverse events.
        data_tests:
          - not_null

      - name: safety_review_ae_count
        data_type: number(38,0)
        description: >
          Number of adverse events requiring safety review.
        data_tests:
          - not_null

      - name: lab_result_count
        data_type: number(38,0)
        description: Total laboratory results for the site.
        data_tests:
          - not_null

      - name: abnormal_lab_count
        data_type: number(38,0)
        description: Number of abnormal laboratory results.
        data_tests:
          - not_null

      - name: protocol_deviation_count
        data_type: number(38,0)
        description: Total protocol deviations associated with the site.
        data_tests:
          - not_null

      - name: major_deviation_count
        data_type: number(38,0)
        description: Number of major protocol deviations.
        data_tests:
          - not_null

      - name: critical_deviation_count
        data_type: number(38,0)
        description: Number of critical protocol deviations.
        data_tests:
          - not_null

      - name: data_query_count
        data_type: number(38,0)
        description: Total clinical data queries for the site.
        data_tests:
          - not_null

      - name: open_query_count
        data_type: number(38,0)
        description: Number of unresolved clinical data queries.
        data_tests:
          - not_null

      - name: resolved_query_count
        data_type: number(38,0)
        description: Number of resolved clinical data queries.
        data_tests:
          - not_null

      - name: avg_query_resolution_days
        data_type: number(10,2)
        description: >
          Average number of days required to resolve completed
          data queries.

      - name: dbt_loaded_at
        data_type: timestamp_ltz
        description: Timestamp when dbt built the mart.