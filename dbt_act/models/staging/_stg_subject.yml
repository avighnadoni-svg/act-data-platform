version: 2

models:

  - name: stg_subject

    description: >
      Clean staging view over ACT_DB.RAW.RAW_SUBJECT_CURRENT.
      Grain is one row per STUDY_ID + SUBJECT_ID.

    # ============================================================
    # MODEL-LEVEL TESTS
    # ============================================================

    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - study_id
              - subject_id

    columns:

      # ==========================================================
      # TECHNICAL KEYS
      # ==========================================================

      - name: subject_key

        description: >
          Deterministic technical key generated from
          STUDY_ID + SUBJECT_ID.

        data_tests:
          - not_null
          - unique


      - name: site_key

        description: >
          Deterministic parent-site key generated from
          STUDY_ID + SITE_ID.

        data_tests:
          - not_null

          - relationships:
              arguments:
                to: ref('stg_site')
                field: site_key


      - name: study_key

        description: >
          Deterministic parent-study key generated from STUDY_ID.

        data_tests:
          - not_null

          - relationships:
              arguments:
                to: ref('stg_study')
                field: study_key


      # ==========================================================
      # BUSINESS KEYS
      # ==========================================================

      - name: study_id
        description: Parent clinical-study identifier.

        data_tests:
          - not_null


      - name: subject_id
        description: Subject business identifier.

        data_tests:
          - not_null


      - name: site_id
        description: Parent site identifier.

        data_tests:
          - not_null


      # ==========================================================
      # SUBJECT ATTRIBUTES
      # ==========================================================

      - name: gender
        description: Subject gender supplied by the source.


      - name: age
        description: Subject age.

        data_tests:

          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 120
                row_condition: "age is not null"


      - name: status
        description: Current subject status.

        data_tests:
          - dbt_utils.not_empty_string


      - name: enrollment_date
        description: Subject enrollment date.


      # ==========================================================
      # TRACEABILITY
      # ==========================================================

      - name: source_updated_at
        description: Source-system update timestamp.

      - name: record_hash
        description: RAW business-content hash.

      - name: source_system
        description: Source-system identifier.

      - name: source_entity
        description: Source entity identifier.

      - name: dag_run_id
        description: Airflow DAG run responsible for ingestion.

      - name: ingested_at
        description: ACT ingestion timestamp.

      - name: source_file_name
        description: S3 source file name.

      - name: source_file_row_number
        description: Row number inside the source file.

      - name: source_file_content_key
        description: Snowflake source-file content key.

      - name: source_file_last_modified
        description: Source-file last-modified timestamp.

      - name: snowflake_load_ts
        description: Snowflake RAW load timestamp.

      - name: current_row_updated_at
        description: Timestamp when RAW_SUBJECT_CURRENT was maintained.